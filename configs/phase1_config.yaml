project:
  name: "iNaturalist-Fungi-Risk-Aware-Classification"
  track: "Track C - iNaturalist Open Data"
  random_seed: 42
  phase: 1

data_paths:
  raw_metadata_csv: "data/raw/fungi_observations_raw.csv"
  raw_photos_csv: "data/raw/fungi_photos_raw.csv"
  species_metadata_csv: "data/species_toxicity_metadata.csv"
  audited_observations_parquet: "data/processed/phase1_audited_observations.parquet"
  figures_dir: "figures/phase1"
  summary_stats_json: "reports/phase1/phase1_audit_summary.json"

subset_selection:
  date_start: "2020-01-01"
  date_end: "2025-12-31"
  quality_grade: "research"
  # Target observations per species (keeps natural long-tail distribution if species has fewer records)
  max_observations_per_species_na: 350
  max_observations_per_species_eu: 150
  regions:
    north_america:
      min_lat: 24.0
      max_lat: 60.0
      min_lon: -130.0
      max_lon: -60.0
    europe:
      min_lat: 36.0
      max_lat: 65.0
      min_lon: -10.0
      max_lon: 35.0

# 40 Carefully Selected Mushroom Species (20 Edible, 20 Toxic/Deadly/Inedible Look-alikes)
